<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>魔法大師 V66 - Gemini 2.0 即時鑑定</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --m-purple: #1A1A2E; --m-gold: #FFD700; --m-blue: #00D2FF; --m-deep: #16213E; --m-red: #FF3B30; --m-parchment: #fdf5e6; }
        body { font-family: -apple-system, "Microsoft JhengHei", sans-serif; margin: 0; background: var(--m-purple); color: white; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
        .page { display: none; padding: 20px; box-sizing: border-box; min-height: 100dvh; flex-direction: column; }
        .page.active { display: flex; }
        .wizard-icon { font-size: 60px; text-align: center; margin: 10px 0; filter: drop-shadow(0 0 10px var(--m-blue)); animation: float 3s infinite; }
        .energy-bar { background: rgba(255,255,255,0.1); border-radius: 10px; padding: 10px; margin: 10px 0; font-size: 14px; border-left: 5px solid var(--m-gold); }
        .magic-card { background: var(--m-parchment); color: #333; border-radius: 20px; padding: 20px; text-align: center; border: 5px solid var(--m-blue); box-shadow: 0 0 20px var(--m-blue); position: relative; display: flex; align-items: center; justify-content: center; flex-direction: column; min-height: 120px; }
        .word-display { font-size: 65px; font-weight: 900; letter-spacing: 8px; color: #222; }
        .tome-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; overflow-y: auto; flex-grow: 1; padding: 10px; background: rgba(0,0,0,0.2); border-radius: 15px; }
        .scroll-icon { background: rgba(255,255,255,0.08); border: 1px solid var(--m-gold); border-radius: 10px; padding: 10px 5px; text-align: center; font-size: 9px; min-height: 70px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .scroll-icon b { margin-top: 5px; color: var(--m-gold); display: block; width: 100%; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
        
        /* 相機 */
        .camera-container { position: relative; width: 100%; height: 260px; background: #000; border-radius: 20px; overflow: hidden; margin: 15px 0; border: 2px solid var(--m-blue); }
        #video { width: 100%; height: 100%; object-fit: cover; }
        .viewfinder { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 85%; height: 120px; border: 3px solid var(--m-gold); border-radius: 10px; box-shadow: 0 0 0 1000px rgba(0,0,0,0.5); pointer-events: none; }

        .btn { padding: 15px; border-radius: 15px; border: none; font-size: 18px; font-weight: bold; cursor: pointer; margin: 5px 0; width: 100%; text-align: center; display: block; box-sizing: border-box; }
        .btn-gold { background: linear-gradient(45deg, var(--m-gold), #FFA500); color: black !important; }
        .btn-outline { background: transparent; border: 2px solid var(--m-blue); color: white !important; }
        
        .loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 5000; display: none; flex-direction: column; align-items: center; justify-content: center; }
        #zoom-modal { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index: 9999; display:none; align-items:center; justify-content:center; }
        #zoom-modal img { max-width: 95%; max-height: 85%; border: 2px solid white; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
    </style>
</head>
<body>

<div id="zoom-modal" onclick="this.style.display='none'"><img id="zoom-img" src=""></div>

<div id="loader" class="loader">
    <div style="border: 4px solid #333; border-top: 4px solid var(--m-gold); width: 40px; height: 40px; border-radius: 50%; animation: spin 1s linear infinite;"></div>
    <p style="margin-top:15px; color:var(--m-gold); font-weight: bold;">🔍 Gemini 2.0 鑑定中...</p>
</div>

<!-- 1. 登入 -->
<div id="page-intro" class="page active">
    <div class="wizard-icon">🧙‍♂️</div>
    <h2 style="text-align: center; color: var(--m-gold); margin: 0;">真理之書：即時鑑定 V66</h2>
    <div style="background:rgba(255,255,255,0.1); padding:15px; border-radius:10px; margin:20px 0;">
        <p style="font-size:12px; margin:0 0 8px 0; color: var(--m-blue);">🔑 請輸入您的 Gemini API Key：</p>
        <input type="text" id="api-key-input" placeholder="AIza..." style="width:100%; padding:12px; border-radius:8px; border:none; box-sizing:border-box; font-size:14px; background:#fff; color:#000;">
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px;">
        <button class="btn btn-outline" onclick="selectUser('小緁')">🪄 魔法師：小緁</button>
        <button class="btn btn-outline" onclick="selectUser('小鈞')">🪄 魔法師：小鈞</button>
        <button class="btn btn-outline" style="border-color: var(--m-gold); color: var(--m-gold) !important;" onclick="selectUser('小凱')">🛠️ 測試帳號：小凱 (2題)</button>
    </div>
</div>

<!-- 2. 圖鑑 -->
<div id="page-home" class="page">
    <div style="display:flex; justify-content: space-between; align-items: center;"><h3>📜 <span id="display-user"></span>的圖鑑</h3><button onclick="location.reload()">登出</button></div>
    <div class="energy-bar">⚡ 今日領獎餘額：<span id="daily-energy">3 / 3</span></div>
    <div id="tome-grid" class="tome-grid"></div>
    <div style="margin-top: 15px;"><button id="start-btn" class="btn btn-gold" onclick="window.showPage('page-mode-select')">⚔️ 開始挑戰</button></div>
</div>

<!-- 3. 模式選擇 -->
<div id="page-mode-select" class="page">
    <h2 style="text-align: center; color: var(--m-gold);">選擇模式</h2>
    <div class="btn btn-gold" style="padding:40px;" onclick="startGame('dictation')">🎧 聽寫測驗</div>
    <div class="btn btn-gold" style="padding:40px; margin-top:20px;" onclick="startGame('copying')">✍️ 照抄測驗</div>
    <button class="btn btn-outline" style="margin-top: auto;" onclick="showPage('page-home')">返回</button>
</div>

<!-- 4. 即時鑑定階段 -->
<div id="page-collect" class="page">
    <div style="display:flex; justify-content: space-between;"><span id="progress-label">1 / 10</span><button onclick="stopCameraAndHome()">✕</button></div>
    <div class="magic-card" style="margin-top:10px;">
        <div id="ui-dictation" style="display:none;"><div style="font-size:70px; cursor:pointer;" onclick="window.speakCurrentWord()">🔊</div></div>
        <div id="ui-copying" style="display:none;"><div id="target-word" class="word-display">...</div></div>
    </div>
    <div class="camera-container"><video id="video" autoplay playsinline></video><div class="viewfinder"></div></div>
    
    <div id="result-area" style="text-align:center; min-height:80px;">
        <div id="result-text" style="font-weight:bold; margin-bottom:5px;"></div>
        <div id="ai-view-box" style="display:none; align-items:center; justify-content:center; gap:10px;">
            <img id="small-preview" style="width:60px; height:30px; border:1px solid var(--m-gold); border-radius:4px;" onclick="window.openZoom(this.src)">
            <button class="btn btn-outline" style="font-size:12px; padding:5px; width:auto;" onclick="forcePass()">🙋 人工通過</button>
        </div>
    </div>

    <button id="detect-btn" class="btn btn-gold" onclick="instantDetect()">🔮 魔法鑑定此題</button>
</div>

<!-- 5. 寶箱 -->
<div id="page-treasure" class="page">
    <h2 style="text-align: center; color: var(--m-gold);">🎁 藏寶室</h2>
    <div id="chest-zone" style="display: flex; justify-content: space-around; margin-top: 40px;">
        <div class="chest" style="font-size:60px; cursor:pointer;" onclick="openChest(this)">📦</div>
        <div class="chest" style="font-size:60px; cursor:pointer;" onclick="openChest(this)">📦</div>
        <div class="chest" style="font-size:60px; cursor:pointer;" onclick="openChest(this)">📦</div>
    </div>
    <div id="prize-reveal" style="display:none; text-align:center; margin-top:20px;"><h1 id="prize-name">...</h1><button class="btn btn-gold" onclick="location.reload()">領取成功</button></div>
</div>

<canvas id="proc-canvas" style="display:none;"></canvas>

<script>
    const defaultSpells = [
        {n: "火球術", t: "fire"}, {n: "冰晶陣", t: "ice"}, {n: "雷神怒", t: "light"}, {n: "風之翼", t: "wind"}, {n: "地動波", t: "earth"}, {n: "聖光盾", t: "shield"},
        {n: "炎爆術", t: "fire"}, {n: "絕對零度", t: "ice"}, {n: "連鎖閃電", t: "light"}, {n: "萬象星隕", t: "fire"}, {n: "餘燼之握", t: "fire"}, {n: "極地風暴", t: "ice"},
        {n: "霹靂一擊", t: "light"}, {n: "龍捲狂襲", t: "wind"}, {n: "金石之軀", t: "earth"}, {n: "太陽射線", t: "fire"}, {n: "霜凍新星", t: "ice"},
        {n: "雷霆萬鈞", t: "light"}, {n: "雲隱術", t: "wind"}, {n: "流沙領域", t: "earth"}, {n: "天使之淚", t: "light"}, {n: "鳳凰涅槃", t: "fire"},
        {n: "冰牆術", t: "ice"}, {n: "電光火石", t: "light"}, {n: "疾風之怒", t: "wind"}, {n: "地裂震波", t: "earth"}, {n: "聖潔光輝", t: "shield"}
    ];
    const officialWords = {"小鈞":["畫畫","送給","一顆","寫下","祝福","一張","可愛","笑臉","感謝","老師","啊","還要","漂亮","蛋糕"],"小緁":["傘","烏雲","天色暗","爺爺","猜字","謎語","撐開","屋頂","柺杖","滴滴答答","叩","嘻嘻哈哈","落下來","大街","答案","園丁","公園","每天","認真","比","遊客","相當","高興","拍照","草皮","摘花","立布告牌","各位","重新","它","欣賞","奇妙"],"小凱":["測試","成功"]};
    
    let currentUser="", currentMode="", mySpells=[], usedWords=[], challenges=[], currentIdx=0, maxChallenges=10, stream=null, chestLocked=false, score=0;

    window.onload = () => { if(localStorage.getItem('gemini_api_key_v2')) document.getElementById('api-key-input').value = localStorage.getItem('gemini_api_key_v2'); };

    window.selectUser = name => {
        const key = document.getElementById('api-key-input').value.trim();
        if(!key.startsWith("AIza")) return alert("請輸入正確金鑰");
        localStorage.setItem('gemini_api_key_v2', key);
        currentUser = name; maxChallenges = (name === '小凱') ? 2 : 10;
        document.getElementById('display-user').innerText = name;
        mySpells = JSON.parse(localStorage.getItem('m_mine_' + currentUser)) || [];
        usedWords = JSON.parse(localStorage.getItem('m_used_' + currentUser)) || [];
        showPage('page-home');
    };

    window.showPage = id => { document.querySelectorAll('.page').forEach(p => p.classList.remove('active')); document.getElementById(id).classList.add('active'); if(id==='page-home') renderHome(); };

    window.renderHome = () => {
        const grid = document.getElementById('tome-grid'); grid.innerHTML = '';
        defaultSpells.forEach(s => {
            const has = mySpells.some(m => m.n === s.n);
            const div = document.createElement('div'); div.className = 'scroll-icon'; div.style.opacity = has ? "1" : "0.2"; div.innerHTML = `📜<br>${s.n}`; grid.appendChild(div);
        });
        const stats = getDailyStats(); document.getElementById('daily-energy').innerText = (3 - stats.count) + " / 3";
        document.getElementById('start-btn').disabled = (stats.count >= 3);
    };

    window.startGame = mode => {
        currentMode = mode; let pool = officialWords[currentUser] || [];
        let avail = pool.filter(w => !usedWords.includes(w));
        if (avail.length < maxChallenges) { usedWords = []; avail = pool; }
        challenges = avail.sort(() => 0.5 - Math.random()).slice(0, maxChallenges);
        usedWords = [...usedWords, ...challenges];
        localStorage.setItem('m_used_'+currentUser, JSON.stringify(usedWords));
        currentIdx = 0; score = 0;
        showPage('page-collect'); startCamera(); updateUI();
    };

    async function startCamera() { try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: 1280 } }); document.getElementById('video').srcObject = stream; } catch (e) { alert("相機失敗"); } }

    // --- 核心：Gemini 2.0 Flash 鑑定 ---
    window.instantDetect = async function() {
        const v = document.getElementById('video'), c = document.getElementById('proc-canvas'), ctx = c.getContext('2d');
        const key = localStorage.getItem('gemini_api_key_v2');
        const resText = document.getElementById('result-text');
        const btn = document.getElementById('detect-btn');

        // 1. 拍照並裁剪 (針對方框) - 修正座標換算
        const vw = v.videoWidth, vh = v.videoHeight;
        // viewfinder 在顯示畫面是 85% 寬、90px 高，垂直置中
        // 需把「顯示座標」換算回「video stream 座標」
        const displayH = v.clientHeight;   // video 元素實際顯示高度
        const displayW = v.clientWidth;
        // video 是 object-fit:cover，計算實際縮放比例
        const scaleX = vw / displayW;
        const scaleY = vh / displayH;
        const scale = Math.max(scaleX, scaleY); // cover 取較大值
        // viewfinder: 寬85%、高90px，垂直水平置中
        const vfW_disp = displayW * 0.85;
        const vfH_disp = 120;
        const vfX_disp = (displayW - vfW_disp) / 2;
        const vfY_disp = (displayH - vfH_disp) / 2;
        // 轉換到 video stream 座標（考慮 cover 偏移）
        const offsetX = (vw - displayW * scale) / 2;
        const offsetY = (vh - displayH * scale) / 2;
        const srcX = offsetX + vfX_disp * scale;
        const srcY = offsetY + vfY_disp * scale;
        const srcW = vfW_disp * scale;
        const srcH = vfH_disp * scale;
        // 輸出放大到 900x300 提升辨識率
        c.width = 900; c.height = 300;
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, 900, 300);
        ctx.drawImage(v, srcX, srcY, srcW, srcH, 0, 0, 900, 300);
        const photo = c.toDataURL('image/jpeg', 0.95);

        // 2. UI 狀態
        document.getElementById('loader').style.display = 'flex';
        btn.disabled = true;

        try {
            // 使用 Gemini 2.0 Flash 正式版網址
            const url = `https://generativelanguage.googleapis.com/v1/models/gemini-2.0-flash:generateContent?key=${key}`;
            const payload = { contents: [{ parts: [
                { text: `你是繁體中文手寫辨識專家。請仔細辨識圖片中的手寫繁體中文字，目標答案是「${challenges[currentIdx]}」。\n判斷規則：若圖片中寫的字和目標答案相同（允許字體潦草），回傳「正確」；否則回傳你實際看到的字。\n只回傳「正確」或你看到的字，不要其他說明。` },
                { inline_data: { mime_type: "image/jpeg", data: photo.split(',')[1] } }
            ] }] };

            const res = await fetch(url, { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(payload) });
            const json = await res.json();
            if (json.error) throw new Error(json.error.message);

            const txt = json.candidates[0].content.parts[0].text.trim();
            const isCorrect = (txt === "正確" || txt.includes(challenges[currentIdx]));

            document.getElementById('loader').style.display = 'none';

            if (isCorrect) {
                score++;
                resText.style.color = "var(--m-gold)";
                resText.innerText = "✅ 鑑定正確！符文生效";
                confetti({ particleCount: 30, spread: 50, origin: { y: 0.8 } });
                setTimeout(() => nextStep(), 1200);
            } else {
                resText.style.color = "var(--m-red)";
                resText.innerText = `❌ AI看到：${txt}`;
                document.getElementById('small-preview').src = photo;
                document.getElementById('ai-view-box').style.display = 'flex';
                btn.disabled = false;
            }
        } catch (e) {
            alert("魔法失敗：" + e.message);
            document.getElementById('loader').style.display = 'none';
            btn.disabled = false;
        }
    };

    window.forcePass = () => { score++; nextStep(); };

    window.nextStep = () => {
        document.getElementById('result-text').innerText = "";
        document.getElementById('ai-view-box').style.display = 'none';
        document.getElementById('detect-btn').disabled = false;
        if (currentIdx < maxChallenges - 1) {
            currentIdx++; updateUI();
        } else {
            stopCameraAndHome(); showPage('page-treasure');
        }
    };

    function updateUI() {
        document.getElementById('progress-label').innerText = `試煉 ${currentIdx+1} / ${maxChallenges}`;
        document.getElementById('target-word').innerText = challenges[currentIdx];
        document.getElementById('ui-dictation').style.display = (currentMode==='dictation'?'block':'none');
        document.getElementById('ui-copying').style.display = (currentMode==='copying'?'block':'none');
        if(currentMode==='dictation') setTimeout(() => window.speakWord(challenges[currentIdx]), 500);
    }

    function stopCameraAndHome() { if(stream) stream.getTracks().forEach(t=>t.stop()); stream=null; showPage('page-home'); }
    function getDailyStats() { const today = new Date().toLocaleDateString(); const key = 'm_daily_' + currentUser; let s = JSON.parse(localStorage.getItem(key)) || {date:today, count:0}; if(s.date!==today) s={date:today, count:0}; return s; }
    window.speakWord = t => { const m = new SpeechSynthesisUtterance(t); m.lang='zh-TW'; speechSynthesis.speak(m); };
    window.openZoom = s => { document.getElementById('zoom-img').src = s; document.getElementById('zoom-modal').style.display = 'flex'; };
    
    window.openChest = el => {
        if(chestLocked) return; chestLocked = true;
        const stats = getDailyStats();
        setTimeout(() => {
            document.getElementById('chest-zone').style.display = 'none'; document.getElementById('prize-reveal').style.display = 'block';
            if (score >= (maxChallenges * 0.8)) {
                const prize = defaultSpells[Math.floor(Math.random()*defaultSpells.length)];
                if(!mySpells.some(m=>m.n===prize.n)) { mySpells.push(prize); localStorage.setItem('m_mine_'+currentUser, JSON.stringify(mySpells)); }
                stats.count++; localStorage.setItem('m_daily_'+currentUser, JSON.stringify(stats));
                confetti(); document.getElementById('prize-name').innerText = "獲得：" + prize.n;
            } else { document.getElementById('prize-name').innerText = "修煉不足"; }
        }, 800);
    };
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>魔法大師 V51 - 深度診斷版</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --m-purple: #1A1A2E; --m-gold: #FFD700; --m-blue: #00D2FF; --m-deep: #16213E; --m-red: #FF3B30; --m-parchment: #fdf5e6; }
        body { font-family: -apple-system, "Microsoft JhengHei", sans-serif; margin: 0; background: var(--m-purple); color: white; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
        .page { display: none; padding: 20px; box-sizing: border-box; min-height: 100dvh; flex-direction: column; }
        .page.active { display: flex; }
        .wizard-icon { font-size: 60px; text-align: center; margin: 10px 0; filter: drop-shadow(0 0 10px var(--m-blue)); animation: float 3s infinite; }
        .energy-bar { background: rgba(255,255,255,0.1); border-radius: 10px; padding: 10px; margin: 10px 0; font-size: 14px; border-left: 5px solid var(--m-gold); }
        .magic-card { background: var(--m-parchment); color: #333; border-radius: 20px; padding: 20px; text-align: center; border: 5px solid var(--m-blue); box-shadow: 0 0 20px var(--m-blue); position: relative; min-height: 120px; display: flex; align-items: center; justify-content: center; flex-direction: column; }
        .word-display { font-size: 65px; font-weight: 900; letter-spacing: 8px; color: #222; }
        .tome-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 15px; overflow-y: auto; flex-grow: 1; padding: 10px; background: rgba(0,0,0,0.2); border-radius: 15px; }
        .scroll-icon { background: rgba(255,255,255,0.08); border: 1px solid var(--m-gold); border-radius: 10px; padding: 10px 5px; text-align: center; font-size: 9px; min-height: 70px; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0.2; }
        .scroll-icon b { margin-top: 5px; color: var(--m-gold); display: block; width: 100%; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
        .review-item { background: rgba(255,255,255,0.1); padding: 15px; border-radius: 15px; margin-bottom: 12px; border-left: 4px solid #555; }
        .preview-img { width: 80px; height: 50px; object-fit: contain; background: #fff; border-radius: 5px; border: 2px solid var(--m-gold); cursor: zoom-in; }
        .detected-tag { background: #000; color: #FFD700; padding: 4px 8px; border-radius: 4px; font-weight: bold; margin: 5px 0; display: inline-block; font-family: monospace; }
        .btn { padding: 15px; border-radius: 15px; border: none; font-size: 18px; font-weight: bold; cursor: pointer; margin: 5px 0; width: 100%; text-align: center; display: block; box-sizing: border-box; }
        .btn-gold { background: linear-gradient(45deg, var(--m-gold), #FFA500); color: black !important; }
        .btn-outline { background: transparent; border: 2px solid var(--m-blue); color: white !important; }
        .loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 5000; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .progress-bar { width: 80%; height: 10px; background: #333; border-radius: 5px; margin-top: 10px; overflow: hidden; border: 1px solid var(--m-gold); }
        .progress-fill { width: 0%; height: 100%; background: var(--m-gold); transition: 0.3s; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        @keyframes rotate { from { transform: rotate(0); } to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="loader" class="loader">
    <div style="border: 4px solid #333; border-top: 4px solid var(--m-gold); width: 40px; height: 40px; border-radius: 50%; animation: rotate 1s linear infinite;"></div>
    <p id="loader-text" style="margin-top:15px; color:var(--m-gold); font-weight: bold;">正在向雲端大腦求證...</p>
    <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
    <p id="progress-status" style="font-size: 14px; color: #aaa;">0 / 10</p>
</div>

<!-- 1. 角色選擇與金鑰 -->
<div id="page-intro" class="page active">
    <div class="wizard-icon">🧙‍♂️</div>
    <h2 style="text-align: center; color: var(--m-gold); margin: 0;">真理之書：V51 診斷版</h2>
    <div style="background:rgba(255,255,255,0.1); padding:15px; border-radius:10px; margin:20px 0;">
        <p style="font-size:12px; margin:0 0 5px 0;">🔑 貼上您的 Gemini API 金鑰：</p>
        <input type="text" id="api-key-input" placeholder="AIza..." style="width:100%; padding:12px; border-radius:8px; border:none; box-sizing:border-box; font-size:16px;">
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px;">
        <button class="btn btn-outline" onclick="selectUser('小緁')">🪄 魔法師：小緁</button>
        <button class="btn btn-outline" onclick="selectUser('小鈞')">🪄 魔法師：小鈞</button>
        <button class="btn btn-outline" style="border-color: var(--m-gold); color: var(--m-gold) !important;" onclick="selectUser('小凱')">🛠️ 測試帳號：小凱</button>
    </div>
</div>

<!-- 2. 圖鑑主頁 -->
<div id="page-home" class="page">
    <div style="display:flex; justify-content: space-between; align-items: center; flex-shrink: 0;">
        <h3 style="color: var(--m-gold); margin: 0;">📜 <span id="display-user"></span>的圖鑑</h3>
        <button onclick="location.reload()" style="background:none; border:1px solid #fff; color:white; padding:5px; border-radius:5px; font-size:10px;">登出</button>
    </div>
    <div class="energy-bar">⚡ 今日領獎餘額：<span id="daily-energy">3 / 3</span></div>
    <div id="tome-grid" class="tome-grid"></div>
    <div style="margin-top: 15px;"><button id="start-btn" class="btn btn-gold" onclick="window.showPage('page-mode-select')">⚔️ 開始試煉</button></div>
</div>

<!-- 3. 模式選擇 -->
<div id="page-mode-select" class="page">
    <h2 style="text-align: center; color: var(--m-gold);">選擇測驗模式</h2>
    <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; gap: 20px;">
        <div class="btn btn-gold" style="padding:30px;" onclick="startGame('dictation')">🎧 聽寫挑戰</div>
        <div class="btn btn-gold" style="padding:30px;" onclick="startGame('copying')">✍️ 照抄挑戰</div>
    </div>
    <button class="btn btn-outline" onclick="showPage('page-home')">返回</button>
</div>

<!-- 4. 拍照拍照 -->
<div id="page-collect" class="page">
    <div style="display:flex; justify-content: space-between;"><span id="progress-label">1 / 10</span><button onclick="stopCameraAndHome()">✕</button></div>
    <div class="magic-card" style="margin-top:10px;">
        <div id="ui-dictation" style="display:none;"><div style="font-size:70px; cursor:pointer;" onclick="window.speakCurrentWord()">🔊</div></div>
        <div id="ui-copying" style="display:none;"><div id="target-word" class="word-display">...</div></div>
    </div>
    <div style="position: relative; width: 100%; height: 260px; background: #000; border-radius: 20px; overflow: hidden; margin: 15px 0; border: 2px solid var(--m-blue);">
        <video id="video" autoplay playsinline style="width: 100%; height: 100%; object-fit: cover;"></video>
        <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 85%; height: 90px; border: 3px solid var(--m-gold); border-radius: 10px; box-shadow: 0 0 0 1000px rgba(0,0,0,0.5); pointer-events: none;"></div>
    </div>
    <button class="btn btn-gold" onclick="snap符文()">🔮 鎖定並錄製</button>
    <button id="btn-next" class="btn btn-outline" style="margin-top:auto;" onclick="nextStep()">下一題</button>
</div>

<!-- 5. 鑑定室 -->
<div id="page-review" class="page">
    <h3 style="text-align: center; color: var(--m-gold);">🔍 鑑定報告</h3>
    <div id="review-list" class="review-list" style="flex-grow: 1; overflow-y: auto;"></div>
    <button class="btn btn-gold" id="btn-ai-start" onclick="startGeminiAI()">🚀 啟動 AI 鑑定</button>
    <button id="final-btn" class="btn btn-gold" style="display:none;" onclick="showPage('page-treasure')">🔓 結算成果</button>
</div>

<!-- 6. 寶箱 -->
<div id="page-treasure" class="page">
    <h2 style="text-align: center; color: var(--m-gold);">🎁 藏寶室</h2>
    <div id="chest-zone" style="display: flex; justify-content: space-around; margin-top: 40px;">
        <div class="chest" style="font-size:60px; cursor:pointer;" onclick="openChest(this)">📦</div>
        <div class="chest" style="font-size:60px; cursor:pointer;" onclick="openChest(this)">📦</div>
        <div class="chest" style="font-size:60px; cursor:pointer;" onclick="openChest(this)">📦</div>
    </div>
    <div id="prize-reveal" style="display:none; text-align:center; margin-top:20px;"><h1 id="prize-name">...</h1><button class="btn btn-gold" onclick="location.reload()">返回圖鑑</button></div>
</div>

<canvas id="proc-canvas" style="display:none;"></canvas>

<script>
    const allSpells = [{n:"火球術",t:"fire"},{n:"冰晶陣",t:"ice"},{n:"雷神怒",t:"light"},{n:"風之翼",t:"wind"},{n:"地動波",t:"earth"},{n:"聖光盾",t:"shield"},{n:"絕對零度",t:"ice"},{n:"太陽射線",t:"fire"},{n:"連鎖閃電",t:"light"},{n:"萬象星隕",t:"fire"}];
    const officialWords = {
        "小鈞": ["畫畫", "送給", "一顆", "寫下", "祝福", "一張", "可愛", "笑臉", "感謝", "老師", "啊", "還要", "漂亮", "蛋糕"],
        "小緁": ["傘", "烏雲", "天色暗", "爺爺", "猜字", "謎語", "撐開", "屋頂", "柺杖", "滴滴答答", "叩", "嘻嘻哈哈", "落下來", "大街", "答案", "園丁", "公園", "每天", "認真", "比", "遊客", "相當", "高興", "拍照", "草皮", "摘花", "立布告牌", "各位", "重新", "它", "欣賞", "奇妙"],
        "小凱": ["測試", "成功"]
    };

    let currentUser="", currentMode="", mySpells=[], usedWords=[], currentIdx=0, workbook=[], maxChallenges=10, stream=null, chestLocked=false;

    window.onload = () => {
        const k = localStorage.getItem('gemini_api_key');
        if(k) document.getElementById('api-key-input').value = k;
    };

    window.selectUser = name => {
        const key = document.getElementById('api-key-input').value.trim();
        if(key) localStorage.setItem('gemini_api_key', key);
        currentUser = name;
        maxChallenges = (name === '小凱') ? 2 : 10;
        document.getElementById('display-user').innerText = name;
        mySpells = JSON.parse(localStorage.getItem('m_mine_'+name)) || [];
        usedWords = JSON.parse(localStorage.getItem('m_used_'+name)) || [];
        showPage('page-home');
    };

    window.showPage = id => {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(id === 'page-home') renderHome();
    };

    window.renderHome = () => {
        const grid = document.getElementById('tome-grid'); grid.innerHTML = '';
        allSpells.forEach(s => {
            const has = mySpells.some(m => m.n === s.n);
            const div = document.createElement('div');
            div.className = 'scroll-icon'; div.style.opacity = has ? "1" : "0.2";
            div.innerHTML = `📜<br>${s.n}`; grid.appendChild(div);
        });
        const stats = getStats();
        document.getElementById('daily-energy').innerText = (3 - stats.count) + " / 3";
    };

    window.startGame = mode => {
        currentMode = mode;
        const pool = officialWords[currentUser] || [];
        let avail = pool.filter(w => !usedWords.includes(w));
        if (avail.length < maxChallenges) { usedWords = []; avail = pool; }
        challenges = avail.sort(() => 0.5 - Math.random()).slice(0, maxChallenges);
        usedWords = [...usedWords, ...challenges];
        localStorage.setItem('m_used_'+currentUser, JSON.stringify(usedWords));
        currentIdx = 0; workbook = []; showPage('page-collect'); startCam(); updateUI();
    };

    function updateUI() {
        document.getElementById('progress-label').innerText = `${currentIdx+1} / ${maxChallenges}`;
        document.getElementById('target-word').innerText = challenges[currentIdx];
        document.getElementById('ui-dictation').style.display = (currentMode==='dictation'?'block':'none');
        document.getElementById('ui-copying').style.display = (currentMode==='copying'?'block':'none');
        if(currentMode==='dictation') setTimeout(() => window.speakCurrentWord(), 500);
    }

    window.nextStep = () => {
        if(!workbook[currentIdx]) return alert("請先拍照");
        if(currentIdx < maxChallenges - 1) { currentIdx++; updateUI(); }
        else { stopCam(); showPage('page-review'); renderReview(); }
    };

    window.snap符文 = () => {
        const v=document.getElementById('video'), c=document.getElementById('proc-canvas'), ctx=c.getContext('2d');
        const vw=v.videoWidth, vh=v.videoHeight;
        c.width=800; c.height=300;
        ctx.drawImage(v,(vw-v.videoWidth*0.85)/2,(vh-v.videoHeight*0.35)/2,v.videoWidth*0.85,v.videoHeight*0.35,0,0,800,300);
        workbook[currentIdx] = {word: challenges[currentIdx], rawPhoto: c.toDataURL('image/jpeg', 0.8), status: null, detectedText: ""};
        alert("✨ 符文已記錄");
    };

    // --- 核心診斷辨識邏輯 ---
    window.startGeminiAI = async function() {
        const key = localStorage.getItem('gemini_api_key');
        if(!key) return alert("請貼上金鑰");
        document.getElementById('loader').style.display = 'flex';
        document.getElementById('btn-ai-start').style.display = 'none';

        for(let i=0; i<workbook.length; i++){
            document.getElementById('progress-status').innerText = `${i+1} / ${workbook.length}`;
            document.getElementById('progress-fill').style.width = ((i+1)/workbook.length*100)+'%';
            
            try {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`;
                const payload = {
                    contents: [{
                        parts: [
                            { text: `你是一個文字辨識大師。請辨識圖中的手寫生字。目標生字是「${workbook[i].word}」。如果正確，請回傳「正確」。如果不正確，請只回傳辨識到的文字。請勿回傳任何說明。` },
                            { inline_data: { mime_type: "image/jpeg", data: workbook[i].rawPhoto.split(',')[1] } }
                        ]
                    }]
                };

                const res = await fetch(url, { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(payload) });
                
                if (!res.ok) {
                    const errorMsg = await res.json();
                    throw new Error(`Google伺服器報錯：${errorMsg.error.message} (代碼: ${res.status})`);
                }

                const json = await res.json();
                const txt = json.candidates[0].content.parts[0].text.trim();
                
                workbook[i].detectedText = txt;
                workbook[i].status = (txt === "正確" || txt.includes(workbook[i].word));
                renderReview();

            } catch (e) {
                alert(`第 ${i+1} 題鑑定發生錯誤：\n${e.message}\n\n請檢查 API Key 或網路狀況。`);
                workbook[i].status = false;
                workbook[i].detectedText = "連線異常";
                break; // 中斷後續，避免連續報錯
            }
        }
        document.getElementById('loader').style.display = 'none';
        document.getElementById('btn-ai-start').style.display = 'block';
    };

    function renderReview() {
        const list = document.getElementById('review-list'); list.innerHTML = '';
        workbook.forEach((item, i) => {
            const div = document.createElement('div');
            div.className = 'review-item';
            let icon = item.status === true ? '✅' : (item.status === false ? '❌' : '⏳');
            div.innerHTML = `<div style="display:flex;align-items:center;"><img src="${item.rawPhoto}" class="preview-img"><div style="flex:1;margin-left:10px;"><b>目標：${item.word}</b><br>AI讀取：<span class="detected-tag">${item.detectedText||'等待鑑定'}</span><br><button onclick="window.manual(${i},${!item.status})">${item.status?'取消':'通過'}</button></div><div style="font-size:24px">${icon}</div></div>`;
            list.appendChild(div);
        });
        document.getElementById('final-btn').style.display = workbook.every(i=>i.status!==null) ? 'block' : 'none';
    }

    window.manual = (i,s) => { workbook[i].status=s; renderReview(); };
    async function startCam(){ try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment",width:1280}}); document.getElementById('video').srcObject=stream;}catch(e){alert("相機失敗");} }
    function stopCam(){ if(stream) stream.getTracks().forEach(t=>t.stop()); }
    window.stopCameraAndHome = () => { stopCam(); showPage('page-home'); };
    window.speakWord = t => { const m = new SpeechSynthesisUtterance(t); m.lang='zh-TW'; speechSynthesis.speak(m); };
    window.speakCurrentWord = () => window.speakWord(challenges[currentIdx]);
    window.openChest = el => { confetti(); alert("獲得咒語！"); location.reload(); };
    function getStats(){ const today = new Date().toLocaleDateString(); const key='m_daily_'+currentUser; let s = JSON.parse(localStorage.getItem(key)) || {date:today, count:0}; if(s.date!==today) s={date:today, count:0}; return s; }
</script>
</body>
</html>
